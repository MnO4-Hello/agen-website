# AGenWebsite 的站点公共配置（root + 缓存 + 反代 + 兜底路由）
#
# 放置位置：/etc/nginx/snippets/agen-app.conf
# 被 deploy/nginx-agen.conf（监听 80）和 deploy/nginx-agen-ssl.conf（监听 443）
# 同时 include —— 所以站点内容只在这里写一份，切 HTTPS 前后行为完全一致。
#
# 结构：Nginx 托管前端静态产物（apps/web/dist），把 /api/ 反代给本机的
# Fastify（127.0.0.1:3000）。这样浏览器只看到**一个源**，前端里所有
# `/api/...` 的相对请求都不用改。

root /srv/agen-website/apps/web/dist;
index index.html;

charset utf-8;

# 后台上传上限是 25MB（作品图 / 文件管理），留一点余量。
# 不设的话 Nginx 默认 1MB，前端会看到 413，而后端日志里什么都没有。
client_max_body_size 30m;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

access_log /var/log/nginx/agen.access.log;
error_log  /var/log/nginx/agen.error.log;

# 带内容哈希的构建产物，可以长缓存
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}

# 管理后台「控制台」的 SSE 实时日志。
# ⚠️ 必须单独关掉缓冲：Nginx 默认会先把上游数据攒在缓冲区里，
# SSE 就会变成「攒满一坨才吐出来」，看起来像日志卡住不动。
location = /api/admin/console/stream {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    # 长连接：断开由后端心跳决定
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 25MB 图片上传走这里，超时给宽一点
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# 前台是**哈希路由**（#home / #works/xxx），真实路径只有 `/`，
# index.html 兜底即可；/admin.html 是真实文件，会被 $uri 先命中。
location / {
    try_files $uri $uri/ /index.html;
}
