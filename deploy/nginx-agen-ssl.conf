# AGenWebsite 的 Nginx HTTPS 配置（阿里云 DV 证书）
#
# 放置位置：/etc/nginx/conf.d/agen-ssl.conf
# 前置条件：证书已放到 /etc/nginx/ssl/（见 deploy/install-cert.sh）
# 生效方式：nginx -t && systemctl reload nginx
#
# 分工：
#   · 80 端口 —— 域名一律 301 到 HTTPS；IP 直连仍由 agen.conf 明文兜底。
#   · 443 端口 —— 真正的站点，内容全部 include snippets/agen-app.conf，
#     跟 80 那份完全同源，避免两边配置漂移。
#
# 域名用 punycode（xn--xxv873h.online = 阿根.online）：Nginx 的 server_name
# 匹配的是 Host 头里的 ASCII 形式，浏览器发过来的就是 punycode。

server {
    listen 80;
    listen [::]:80;

    server_name xn--xxv873h.online www.xn--xxv873h.online;

    # 301 而不是 302：让浏览器/搜索引擎把 HTTPS 记成唯一入口。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # IP 也挂在 443 上，只是为了「https://IP 也能打开后台」；
    # 证书不含 IP，浏览器会告警，正常访问请用域名。
    server_name xn--xxv873h.online www.xn--xxv873h.online 121.196.175.54;

    # 证书文件是阿里云「Nginx」格式包里的 pem/key：
    # pem 里已经带了中间证书（2 段），不要再手动拼 chain。
    ssl_certificate     /etc/nginx/ssl/agen.online.pem;
    ssl_certificate_key /etc/nginx/ssl/agen.online.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 会话复用：握手少一次往返
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（一年）。注意：一旦下发，浏览器在有效期内**只走 HTTPS**；
    # 将来证书过期没续上，用户会连警告页都点不过去。
    # 想缩短/关掉：改这里的 max-age，或整行删掉后 reload。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/agen-app.conf;
}
