# AGenWebsite 的 Nginx HTTP 站点配置
#
# 放置位置：/etc/nginx/conf.d/agen.conf
# 生效方式：nginx -t && systemctl reload nginx
#
# 这里只负责「监听 80 + 端口绑定」，站点内容全在 snippets/agen-app.conf；
# HTTPS（443）在 deploy/nginx-agen-ssl.conf 里，只在证书就位后才启用。

server {
    listen 80;
    listen [::]:80;

    # ⚠️ 用 IP 直连时**这里必须写真实公网 IP**，不能留 `_`。
    # 原因：阿里云镜像的 /etc/nginx/nginx.conf 里内置了一个 `server_name _;` 的默认站点，
    # 它先加载，会把 `_` 抢走 → 日志出现 `conflicting server name "_" ... ignored`，
    # 浏览器打开看到的是 Nginx 欢迎页。
    # deploy/server-install.sh 会自动把这一行替换成探测到的公网 IP；
    # 手工部署时自己改，或者以后绑了域名改成：server_name example.com www.example.com;
    #
    # 有域名 + 证书后：域名走 nginx-agen-ssl.conf 里的 301 跳转，
    # 这个 block 只剩「IP 明文兜底」的作用（运维/证书出问题时还能进后台）。
    server_name _;

    include /etc/nginx/snippets/agen-app.conf;
}
